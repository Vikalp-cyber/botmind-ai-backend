[project]
name = "botmind-ai-backend"
version = "0.1.0"
description = "Production-ready multi-tenant AI chatbot SaaS backend."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.2",
  "asyncpg>=0.29.0",
  "beautifulsoup4>=4.12.3",
  "fastapi>=0.115.0",
  "greenlet>=3.0.3",
  "httpx>=0.27.0",
  "openai>=1.30.0",
  "passlib[bcrypt]>=1.7.4",
  "pgvector>=0.2.5",
  "pydantic[email]>=2.7.1",
  "pydantic-settings>=2.2.1",
  "pyjwt>=2.8.0",
  "pdfplumber>=0.11.0",
  "python-docx>=1.1.0",
  "pypdf>=4.2.0",
  "python-multipart>=0.0.9",
  "redis>=5.0.4",
  "sqlalchemy>=2.0.30",
  "structlog>=24.1.0",
  "tenacity>=8.3.0",
  "tiktoken>=0.7.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "ruff>=0.4.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
