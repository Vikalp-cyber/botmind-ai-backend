services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: botmind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Must match app EMBEDDING_DIMENSIONS (e.g. 768 for Ollama nomic-embed-text, 1536 for OpenAI ada-002)
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  app:
    build: .
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
